name: Build Windows Executable

on:
  push:
    branches: ["main", "master"]
    paths:
      - "**.py"
      - "**.spec"
      - "requirements*.txt"
      - ".github/workflows/build-windows.yml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "**.py"
      - "**.spec"
      - "requirements*.txt"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

jobs:
  build:
    name: PyInstaller — windows-latest
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip and install core requirements
        run: |
          python -m pip install --upgrade pip
          # Install only the lightweight core requirements for the CI build.
          # Heavy optional packages (torch, SimpleITK, dicom2nifti) are excluded
          # to keep the CI fast; they are optional at runtime.
          python -m pip install `
            customtkinter==5.2.2 `
            pydicom==2.4.4 `
            pandas==2.1.4 `
            "numpy<2" `
            Pillow==10.1.0 `
            tqdm==4.66.1 `
            matplotlib==3.8.2 `
            scikit-learn==1.3.2 `
            scipy==1.11.4 `
            requests==2.31.0 `
            packaging==23.2 `
            tkinterdnd2

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build portable one-folder distribution
        run: |
          python -m PyInstaller DICOM_Organizer.spec --noconfirm --clean

      - name: Verify output exists
        run: |
          if (-Not (Test-Path "dist\DICOM_Organizer\DICOM_Organizer.exe")) {
            Write-Error "dist\DICOM_Organizer\DICOM_Organizer.exe not found!"
            exit 1
          }
          Write-Output "Build successful: dist\DICOM_Organizer\DICOM_Organizer.exe exists."

      - name: Upload portable distribution as artifact
        uses: actions/upload-artifact@v4
        with:
          name: DICOM_Organizer-windows
          path: dist/DICOM_Organizer/
          if-no-files-found: error
